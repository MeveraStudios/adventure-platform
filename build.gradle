buildscript {
  ext {
    indraVersion = '4.0.0'
  }
}

plugins {
  id 'net.kyori.indra' version "$indraVersion" apply false
  id 'net.kyori.indra.licenser.spotless' version "$indraVersion" apply false
  id 'net.kyori.indra.crossdoc' version "$indraVersion" apply false
  id 'com.vanniktech.maven.publish' version '0.37.0' apply false
}

// Adventure version
ext.adventure = "5.2.0"

group = 'studio.mevera.adventure'
// CI sets SNAPSHOT_BUILD on pushes to main, releases build the plain version
version = System.getenv('SNAPSHOT_BUILD') == 'true' ? '1.0.2-SNAPSHOT' : '1.0.2'
description = 'Legacy platform integrations for the adventure UI library'

/**
 * Bukkit and its dependencies have metadata that is incorrect and excludes some annotation APIs.
 *
 * To suppress compiler warnings from being unable to find the appropriate annotations,
 * we inject the dependencies here.
 */
@CacheableRule
class BukkitAnnotationsRule implements ComponentMetadataRule {

  @Override
  void execute(final ComponentMetadataContext componentMetadataContext) {
    componentMetadataContext.details.withVariant("compile") {
      withDependencies {
        add("com.google.errorprone:error_prone_annotations:2.41.0")
        add("org.jetbrains:annotations:26.0.2")
      }
    }
  }
}

subprojects {
  group = rootProject.group
  version = rootProject.version

  apply plugin: 'net.kyori.indra'
  apply plugin: 'maven-publish'
  apply plugin: 'com.vanniktech.maven.publish'
  apply plugin: 'net.kyori.indra.checkstyle'
  apply plugin: 'net.kyori.indra.licenser.spotless'
  apply plugin: 'net.kyori.indra.crossdoc'


  dependencies {
    components {
      withModule("com.destroystokyo.paper:paper-api", BukkitAnnotationsRule)
    }
    annotationProcessor 'ca.stellardrift:contract-validator:1.0.1'
    checkstyle 'ca.stellardrift:stylecheck:0.2.1'
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.13.4'
    testImplementation 'org.junit.jupiter:junit-jupiter-engine:5.13.4'
  }
  
  tasks.withType(Javadoc).configureEach {
    failOnError = false
    options {
      links(
        "https://jd.advntr.dev/api/$adventure",
        "https://jd.advntr.dev/text-serializer-legacy/$adventure",
        "https://jd.advntr.dev/text-serializer-gson/$adventure",
        "https://jd.advntr.dev/nbt/$adventure"
      )
    }
  }

  indra {
    javaVersions {
      target(21)
      testWith(21, 25)
    }

    github("MeveraStudios", "adventure-platform") {
      ci(true)
    }
    mitLicense()
  }
  
  indraCrossdoc {
      baseUrl().set(providers.gradleProperty('javadocPublishRoot'))
      nameBasedDocumentationUrlProvider {
          projectNamePrefix = "adventure-platform-"
      }
  }

  mavenPublishing {
    // indra already registers the sources and javadoc jars Maven Central requires, and both are
    // part of the java component, so the publish plugin must not add competing copies of them.
    configure(new com.vanniktech.maven.publish.JavaLibrary(new com.vanniktech.maven.publish.JavadocJar.None(), true))

    coordinates(project.group as String, project.name, project.version as String)

    pom {
      name = project.name
      description = project.description ?: rootProject.description
      inceptionYear = '2018'
      url = 'https://github.com/MeveraStudios/adventure-platform/'
      licenses {
        license {
          name = 'MIT'
          url = 'https://opensource.org/licenses/MIT'
          distribution = 'https://mit-license.org/'
        }
      }
      developers {
        developer {
          id = 'iiahmedyt'
          name = 'iiAhmedYT'
          url = 'https://github.com/iiAhmedYT/'
          timezone = 'Egypt/Cairo'
        }
      }
      scm {
        url = 'https://github.com/MeveraStudios/adventure-platform/'
        connection = 'scm:git:git://github.com/MeveraStudios/adventure-platform.git'
        developerConnection = 'scm:git:ssh://git@github.com/MeveraStudios/adventure-platform.git'
      }
    }

    publishToMavenCentral()

    // Signing key comes from ORG_GRADLE_PROJECT_signingInMemoryKey in CI.
    // Without it, publishing to maven local still works unsigned.
    if (project.findProperty('signingInMemoryKey') != null) {
      signAllPublications()
    }
  }
}
